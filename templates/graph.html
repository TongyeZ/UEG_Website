<!DOCTYPE html>
<html>
<head>
    <title>Scatter Plot</title>

    <link href="{{ url_for('static', filename='Searchbar.css') }}" rel="stylesheet" type="text/css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #1B2631;
            text-align: center;
            font-family: arial, sans-serif; 
            font-size: 32px; 
            margin: 20px 70px; 
            font-weight: 100;
        }

        #geneIdInput {
        padding: 5px;
        font-size: 15px;
        margin-right: 10px; 
        border-radius: 5px;
        }

        #searchContainer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        #categorySelect {
            padding: 6px 8px;
            font-size: 15px;
            border-radius: 5px;
        }

        #scatterPlot {
            width: 800px;
            height: 600px;
            margin: 0 auto;
        }

        #plotAndLegend {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }

        #legendContainer {
            min-width: 250px;
            max-width: 320px;
            border: 1px solid #d4d8dc;
            border-radius: 8px;
            padding: 12px;
            background: #fafbfc;
        }

        #legendContainer h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 600;
            color: #1B2631;
        }

        #colorLegendTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        #colorLegendTable th,
        #colorLegendTable td {
            border: 1px solid #e1e5ea;
            padding: 6px 8px;
            text-align: left;
        }

        .legend-swatch {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 1px solid #444;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    {% include "navbar.html" %}

    <h1>Scatter Plot</h1>
    <div id="container">
        <div id="searchContainer">
            <select id="categorySelect">
                <option value="">All Transcriptome Groups</option>
            </select>
            <input type="text" id="geneIdInput" placeholder="Enter GeneID">
            <button id="searchButton">Search</button>
        </div>
        <div id="plotAndLegend">
            <div id="scatterPlot"></div>
            <div id="legendContainer">
                <h3>Color Legend (SEP)</h3>
                <table id="colorLegendTable"></table>
            </div>
        </div>
    </div>

    
    <script src="{{ url_for('static', filename='search_website.js') }}"></script>
    
</body>
</html>
